name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q harness_search runtime runner datagen scripts tests
      - run: for script in scripts/*.sh dataset_runs/*.sh; do bash -n "$script"; done
      - run: python -m unittest discover -s tests -p test_setup.py -k LauncherTests -v
      - run: python scripts/export_source.py
